<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027">
        <animate attributeName="stop-color" values="#0f2027;#1a2a6c;#0f2027" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364">
        <animate attributeName="stop-color" values="#2c5364;#6a3093;#2c5364" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <style>
      .name { font: 800 62px 'Segoe UI', Arial, sans-serif; fill: url(#nameGrad); letter-spacing: 2px;
              opacity: 0; animation: rise 1.4s ease-out forwards; }
      .sub  { font: 500 22px 'Segoe UI', Arial, sans-serif; fill: #e6edf3; letter-spacing: 1px;
              opacity: 0; animation: rise 1.4s ease-out 0.6s forwards; }
      .tag  { font: 400 16px 'Courier New', monospace; fill: #8b949e;
              opacity: 0; animation: rise 1.4s ease-out 1.2s forwards; }
      .line { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 1.6s ease-out 0.8s forwards; }
      .f1 { animation: float 6s ease-in-out infinite; }
      .f2 { animation: float 8s ease-in-out infinite reverse; }
      .f3 { animation: float 7s ease-in-out 1s infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    </style>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>

  <!-- floating shapes -->
  <circle class="f1" cx="110" cy="70" r="46" fill="#58a6ff" opacity="0.12"/>
  <circle class="f2" cx="1080" cy="190" r="64" fill="#c084fc" opacity="0.12"/>
  <rect class="f3" x="980" y="40" width="54" height="54" rx="12" fill="#58a6ff" opacity="0.10" transform="rotate(20 1007 67)"/>
  <circle class="f3" cx="180" cy="210" r="22" fill="#c084fc" opacity="0.15"/>

  <!-- text -->
  <text x="600" y="112" text-anchor="middle" class="name">HIRUSHI SAMMANI</text>
  <line class="line" x1="390" y1="132" x2="810" y2="132" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
  <text x="600" y="172" text-anchor="middle" class="sub">Computer Science Undergraduate</text>
  <text x="600" y="206" text-anchor="middle" class="tag">AI  •  DevOps  •  Web Development</text>
</svg>
